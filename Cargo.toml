[package]
name = "sce_app_mini-runtime"
version = "0.0.0-dev"
edition = "2021"
description = "脱机运行时"
license = "AGPL-3.0"

[[bin]]
name = "sce_app_mini-runtime"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
bgd_appsdk = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking"] }
md-5 = "0.10"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
windows-capture = "1"
# 注意：keyring 3.x 无默认特性，必须显式启用 windows-native（否则静默退化为内存 mock store）
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

# 研究工具（examples/*.rs）专用依赖，不进主程序
[dev-dependencies]
base64 = "0.22"
prost = "0.13"
prost-types = "0.13"
capstone = "0.12"
bcdec_rs = "0.2"
frida = { version = "0.17", features = ["auto-download"] }

[profile.release]
opt-level = 2
strip = true
