name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Inject version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $cargo = Get-Content Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]*"', "version = `"$ver`""
          Set-Content Cargo.toml $cargo -NoNewline -Encoding utf8
          $notes = git log --pretty=format:"- %s (``%h``)" -n 20 --no-merges | Out-String
          $notes | Set-Content release_notes.md -Encoding utf8

      - name: Build release
        run: cargo build --release
        # 同时产出 mini-client.exe（0.6.0 对端联机启动器，房主分发给朋友用）

      - name: Generate app-release.json
        shell: pwsh
        run: |
          $meta = Get-Content app.json -Raw -Encoding utf8 | ConvertFrom-Json
          $meta | Add-Member -NotePropertyName version -NotePropertyValue ("${{ github.ref_name }}".TrimStart('v'))
          $meta | Add-Member -NotePropertyName release_notes -NotePropertyValue (Get-Content release_notes.md -Raw -Encoding utf8)
          $meta | ConvertTo-Json -Depth 5 | Set-Content app-release.json -Encoding utf8

      # base_assets.7z 不入 git（19MB 二进制）：从前一 release 继承；首版或内容更新时
      # 由维护者本地 examples/pack_base_assets.ps1 重打后 gh release upload --clobber
      - name: Carry forward base_assets.7z from previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern base_assets.7z --dir . 2>$null
          if (Test-Path base_assets.7z) { Write-Host "已从前一 release 继承 base_assets.7z" }
          else { Write-Host "::warning::无历史 base_assets.7z，本 release 将不附带基座资产包（payload sync 下载通道不可用，仅本机编辑器兜底）" }
          exit 0

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: sce_app_mini-runtime ${{ github.ref_name }}
          files: |
            target/release/sce_app_mini-runtime.exe
            target/release/mini-client.exe
            app-release.json

      - name: Upload base_assets.7z
        if: hashFiles('base_assets.7z') != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: base_assets.7z
